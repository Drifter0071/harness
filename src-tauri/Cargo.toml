[package]
name = "harness"
version = "0.1.0"
description = "Ultra-lightweight AI Agent Harness"
authors = ["harness"]
edition = "2021"

[lib]
name = "harness_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "compression" brotli-compresses the embedded frontend assets at build
# time (the ~4 MB dist/ is the single biggest contributor to exe size).
tauri = { version = "2", features = ["compression"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Narrowed from "full" — only the modules the code actually uses
# (sync/task/time/fs/process + what reqwest and the HCI server need).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "process", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
open = "5"
urlencoding = "2"
eventsource-stream = "0.2"
# HTML parsing for the DuckDuckGo HTML search backend. `scraper` wraps
# html5ever (the same parser Firefox uses) and gives us a jQuery-like
# CSS-selector API. The Instant Answer JSON endpoint at api.duckduckgo.com
# is effectively dead for non-Wikipedia queries, so we hit the
# keyless HTML search endpoint at html.duckduckgo.com/html/ instead.
scraper = { version = "0.20", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
dashmap = "6"
rand = "0.8"
futures-util = "0.3"
bytes = "1"
tempfile = "3"
base64 = "0.22"
thiserror = "1"
async-trait = "0.1"
notify = "6"

[dev-dependencies]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release profile: minimize binary size while keeping debug symbols
# available for crash reports. lto=fat inlines across crates; codegen-
# units=1 enables that. opt-level="z" optimizes for size. strip removes
# the symbol table. The combination shaves ~30–50% off a release
# build's binary size with no perceptible runtime cost.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
