[package]
name = "harness"
version = "0.1.0"
description = "Ultra-lightweight AI Agent Harness"
authors = ["harness"]
edition = "2021"

[lib]
name = "harness_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
open = "5"
urlencoding = "2"
eventsource-stream = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
dashmap = "6"
rand = "0.8"
futures-util = "0.3"
bytes = "1"
tempfile = "3"
base64 = "0.22"
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release profile: minimize binary size while keeping debug symbols
# available for crash reports. lto=fat inlines across crates; codegen-
# units=1 enables that. opt-level="z" optimizes for size. strip removes
# the symbol table. The combination shaves ~30–50% off a release
# build's binary size with no perceptible runtime cost.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
